name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generar proyecto Android
        run: |
          flutter create . --org com.radiomundo --project-name radio_mundo
          git checkout -- lib pubspec.yaml
      - name: Configurar manifiesto
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/><application android:usesCleartextTraffic="true"#' $M
          sed -i 's#</application>#<service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true"><intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter></service><receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter></receiver></application>#' $M
          F=$(find android/app/src/main -name MainActivity.kt)
          sed -i 's/FlutterActivity/AudioServiceActivity/g; s#^import io.flutter.embedding.android.AudioServiceActivity#import com.ryanheise.audioservice.AudioServiceActivity#' $F
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: radio-mundo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
